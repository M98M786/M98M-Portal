name: engine guard
# Keeps the live m98m-engine Worker and its cron slots equal to main (engine/worker.js + engine/crons.json).
# A deploy from a dashboard or from a checkout that is not main is put back within 15 minutes.
on:
  push:
    branches: [main]
    paths: ['engine/worker.js', 'engine/crons.json', 'scripts/engine-guard.py', '.github/workflows/engine-guard.yml']
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}
concurrency: engine-guard
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: keep the live engine equal to main
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python3 scripts/engine-guard.py
