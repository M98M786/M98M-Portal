<!DOCTYPE html>
<html lang="en" data-theme="royal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M98M — Order Operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   M98M ORDER OPS — Royal theme
   Navy #161A25 · metallic gold · swoosh blue
   ============================================================ */

:root{
  --bg:#0B0E16;
  --bg-grad:radial-gradient(1200px 600px at 78% -8%, rgba(0,100,210,.10), transparent 60%),
            radial-gradient(900px 500px at 8% -4%, rgba(201,162,39,.07), transparent 55%);
  --panel:#161A25;
  --panel-2:#1B2130;
  --panel-3:#232A3B;
  --line:rgba(255,255,255,.07);
  --line-2:rgba(255,255,255,.14);

  --text:#E9ECF4;
  --text-2:#9AA3B8;
  --text-3:#616B82;

  --gold:#D8B24C;
  --gold-hi:#F0D68A;
  --gold-lo:#A8811F;
  --gold-veil:rgba(216,178,76,.12);
  --gold-line:rgba(216,178,76,.34);

  --blue:#4D9CF5;
  --blue-veil:rgba(77,156,245,.13);
  --blue-line:rgba(77,156,245,.32);

  --rose:#F0616D;   --rose-veil:rgba(240,97,109,.13);   --rose-line:rgba(240,97,109,.32);
  --amber:#E9A93A;  --amber-veil:rgba(233,169,58,.13);  --amber-line:rgba(233,169,58,.30);
  --orange:#EE8449; --orange-veil:rgba(238,132,73,.13); --orange-line:rgba(238,132,73,.30);
  --teal:#3FC2A8;   --teal-veil:rgba(63,194,168,.13);   --teal-line:rgba(63,194,168,.30);
  --green:#58BE6C;  --green-veil:rgba(88,190,108,.13);  --green-line:rgba(88,190,108,.30);
  --peri:#8E9EF5;   --peri-veil:rgba(142,158,245,.13);  --peri-line:rgba(142,158,245,.30);
  --mauve:#C983D6;  --mauve-veil:rgba(201,131,214,.13); --mauve-line:rgba(201,131,214,.30);
  --sky:#5BBBE8;    --sky-veil:rgba(91,187,232,.13);    --sky-line:rgba(91,187,232,.30);

  --grid:rgba(255,255,255,.055);
  --shadow:0 18px 50px -22px rgba(0,0,0,.95);
  --r:12px; --r-sm:9px; --r-xs:7px;

  --font:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --display:"Sora","Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}

html[data-theme="ivory"]{
  --bg:#F4F1E9;
  --bg-grad:radial-gradient(1100px 560px at 80% -8%, rgba(0,100,210,.09), transparent 60%),
            radial-gradient(900px 480px at 6% -4%, rgba(168,129,31,.10), transparent 55%);
  --panel:#FFFDF8;
  --panel-2:#F7F3E9;
  --panel-3:#EFE9DA;
  --line:rgba(22,26,37,.10);
  --line-2:rgba(22,26,37,.20);

  --text:#161A25;
  --text-2:#4E566B;
  --text-3:#7C8497;

  --gold:#9A7415; --gold-hi:#C79C2C; --gold-lo:#7A5A0D;
  --gold-veil:rgba(154,116,21,.11); --gold-line:rgba(154,116,21,.30);
  --blue:#0F63C4; --blue-veil:rgba(15,99,196,.10); --blue-line:rgba(15,99,196,.28);

  --rose:#C6303F;   --rose-veil:rgba(198,48,63,.10);   --rose-line:rgba(198,48,63,.28);
  --amber:#A8720A;  --amber-veil:rgba(168,114,10,.11); --amber-line:rgba(168,114,10,.28);
  --orange:#B85618; --orange-veil:rgba(184,86,24,.10); --orange-line:rgba(184,86,24,.26);
  --teal:#0B7A66;   --teal-veil:rgba(11,122,102,.10);  --teal-line:rgba(11,122,102,.26);
  --green:#2C7A3D;  --green-veil:rgba(44,122,61,.10);  --green-line:rgba(44,122,61,.26);
  --peri:#4353C6;   --peri-veil:rgba(67,83,198,.10);   --peri-line:rgba(67,83,198,.26);
  --mauve:#8B3C9B;  --mauve-veil:rgba(139,60,155,.10); --mauve-line:rgba(139,60,155,.26);
  --sky:#1177B0;    --sky-veil:rgba(17,119,176,.10);   --sky-line:rgba(17,119,176,.26);

  --grid:rgba(22,26,37,.07);
  --shadow:0 18px 44px -24px rgba(22,26,37,.40);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);background-image:var(--bg-grad);background-attachment:fixed;
  color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--panel-3);border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:var(--line-2)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh}

.side{
  position:sticky;top:0;height:100vh;width:236px;flex:0 0 236px;
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--panel) 0%, color-mix(in srgb,var(--panel) 88%, var(--bg)) 100%);
  border-right:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;padding:16px 15px;border-bottom:1px solid var(--line)}
.crest{
  width:34px;height:34px;flex:none;border-radius:9px;display:grid;place-items:center;
  font-family:var(--display);font-weight:700;font-size:14px;color:#1A1405;
  background:linear-gradient(145deg,var(--gold-hi) 0%,var(--gold) 45%,var(--gold-lo) 100%);
  box-shadow:0 2px 12px -2px rgba(216,178,76,.5), inset 0 1px 0 rgba(255,255,255,.45);
}
.brand-t{font-family:var(--display);font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.brand-s{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);opacity:.85;margin-top:1px}

.nav{flex:1;overflow-y:auto;padding:8px}
.nav-lbl{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);padding:12px 9px 5px}
.nav-i{
  display:flex;align-items:center;gap:10px;width:100%;padding:8px 9px;border-radius:var(--r-xs);
  font-size:13px;color:var(--text-2);text-align:left;transition:background .14s,color .14s;
  position:relative;
}
.nav-i:hover{background:rgba(255,255,255,.045);color:var(--text)}
html[data-theme="ivory"] .nav-i:hover{background:rgba(22,26,37,.045)}
.nav-i.on{background:var(--gold-veil);color:var(--text)}
.nav-i.on::before{content:"";position:absolute;left:-8px;top:7px;bottom:7px;width:2.5px;border-radius:0 3px 3px 0;background:linear-gradient(180deg,var(--gold-hi),var(--gold-lo))}
.nav-i svg{flex:none;opacity:.8}
.nav-i.on svg{color:var(--gold);opacity:1}
.nav-i span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-family:var(--mono);font-size:10px;padding:1.5px 6px;border-radius:20px;background:rgba(255,255,255,.06);color:var(--text-3)}
html[data-theme="ivory"] .pill{background:rgba(22,26,37,.06)}
.pill.gold{background:var(--gold-veil);color:var(--gold)}
.pill.rose{background:var(--rose-veil);color:var(--rose)}
.pill.amber{background:var(--amber-veil);color:var(--amber)}
.pill.peri{background:var(--peri-veil);color:var(--peri)}
.pill.orange{background:var(--orange-veil);color:var(--orange)}

.who{margin:10px;padding:10px;border:1px solid var(--line);border-radius:var(--r-sm);display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.02)}
html[data-theme="ivory"] .who{background:rgba(22,26,37,.02)}
.avatar{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--gold-veil);color:var(--gold);border:1px solid var(--gold-line)}

.main{flex:1;min-width:0}

/* ---------- topbar ---------- */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-r{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:11px 20px}
.srch{position:relative;flex:1;min-width:190px;max-width:380px}
.srch svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none}
.srch input{
  width:100%;padding:8px 30px 8px 33px;border-radius:var(--r-sm);
  background:var(--panel);border:1px solid var(--line);font-size:13px;
  transition:border-color .15s,box-shadow .15s;
}
.srch input::placeholder{color:var(--text-3)}
.srch input:focus{outline:none;border-color:var(--gold-line);box-shadow:0 0 0 3px var(--gold-veil)}
.srch .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--text-3);display:none;padding:2px}
.srch .clr.on{display:block}

.sel{position:relative;display:inline-flex}
.sel select{
  appearance:none;padding:7px 26px 7px 10px;border-radius:var(--r-sm);
  background:var(--panel);border:1px solid var(--line);font-size:12px;color:var(--text-2);
  transition:border-color .15s;cursor:pointer;
}
.sel select:hover{border-color:var(--line-2)}
.sel select:focus{outline:none;border-color:var(--gold-line);color:var(--text)}
.sel svg{position:absolute;right:8px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--text-3)}

.ghost{padding:6px 10px;border:1px solid var(--line);border-radius:var(--r-sm);font-size:11.5px;color:var(--text-2);display:inline-flex;align-items:center;gap:5px;transition:border-color .15s,color .15s}
.ghost:hover{border-color:var(--line-2);color:var(--text)}
.icobtn{padding:7px;border:1px solid var(--line);border-radius:var(--r-sm);color:var(--text-2);position:relative;transition:border-color .15s,color .15s}
.icobtn:hover{border-color:var(--gold-line);color:var(--gold)}
.dot-n{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;padding:0 4px;border-radius:20px;background:var(--rose);color:#fff;font-family:var(--mono);font-size:9px;font-weight:600;display:grid;place-items:center}
.stamp{display:flex;align-items:center;gap:7px;padding:6px 10px;border:1px solid var(--line);border-radius:var(--r-sm);font-size:11.5px;color:var(--text-3)}

.quick{display:flex;gap:6px;overflow-x:auto;padding:0 20px 9px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.qb{white-space:nowrap;padding:4.5px 11px;border-radius:20px;border:1px solid var(--line);font-size:11.5px;font-weight:500;color:var(--text-3);transition:all .15s}
.qb:hover{border-color:var(--line-2);color:var(--text-2)}
.qb.on{border-color:var(--gold-line);background:var(--gold-veil);color:var(--gold)}

/* ---------- custom date range ---------- */
.rangewrap{position:relative;display:inline-flex}
.rangepop{position:absolute;top:calc(100% + 8px);left:0;z-index:55;width:296px;
  background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r);
  box-shadow:var(--shadow);padding:14px;display:none}
.rangepop.on{display:block}
.rp-l{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--text-3);font-weight:700;margin-bottom:7px}
.seg{display:flex;gap:4px;padding:3px;border-radius:var(--r-xs);background:rgba(255,255,255,.045);margin-bottom:13px}
html[data-theme="ivory"] .seg{background:rgba(22,26,37,.05)}
.seg button{flex:1;padding:5.5px 4px;border-radius:5px;font-size:11.5px;font-weight:600;color:var(--text-3);transition:background .14s,color .14s}
.seg button:hover{color:var(--text-2)}
.seg button.on{background:var(--gold-veil);color:var(--gold)}
.rp-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:11px}
.dinput{width:100%;padding:7px 9px;border-radius:var(--r-xs);background:var(--panel-2);
  border:1px solid var(--line);font-family:var(--mono);font-size:12px;color:var(--text);transition:border-color .14s}
.dinput:focus{outline:none;border-color:var(--gold-line);box-shadow:0 0 0 3px var(--gold-veil)}
.dinput::-webkit-calendar-picker-indicator{filter:invert(.65);cursor:pointer;opacity:.7}
.dinput::-webkit-calendar-picker-indicator:hover{opacity:1}
html[data-theme="ivory"] .dinput::-webkit-calendar-picker-indicator{filter:none}
.rp-err{font-size:11px;color:var(--rose);margin:-4px 0 10px;display:none;line-height:1.4}
.rp-err.on{display:block}
.rp-sets{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.rp-sets button{padding:4px 9px;border-radius:20px;border:1px solid var(--line);font-size:11px;color:var(--text-2);transition:all .14s}
.rp-sets button:hover{border-color:var(--gold-line);background:var(--gold-veil);color:var(--gold)}
.rp-foot{display:flex;gap:7px}
.btn-p{flex:1;padding:7.5px;border-radius:var(--r-xs);font-size:12px;font-weight:700;color:#1A1405;
  background:linear-gradient(145deg,var(--gold-hi),var(--gold));transition:filter .14s}
.btn-p:hover{filter:brightness(1.09)}
.btn-s{padding:7.5px 13px;border-radius:var(--r-xs);border:1px solid var(--line);font-size:12px;color:var(--text-2);transition:all .14s}
.btn-s:hover{border-color:var(--line-2);color:var(--text)}
.rchip{display:inline-flex;align-items:center;gap:7px;padding:5px 7px 5px 10px;border-radius:20px;
  border:1px solid var(--gold-line);background:var(--gold-veil);color:var(--gold);font-size:11.5px;font-weight:600;white-space:nowrap}
.rchip b{font-family:var(--mono);font-weight:600;letter-spacing:-.01em}
.rchip .rx{color:var(--gold);opacity:.65;display:flex;padding:1px;border-radius:4px;transition:opacity .14s}
.rchip .rx:hover{opacity:1}
.rchip .redit{cursor:pointer}

/* ---------- content ---------- */
.wrap{padding:20px}
.head-h1{font-family:var(--display);font-size:23px;font-weight:600;letter-spacing:-.025em;margin:0}
.head-p{font-size:13px;color:var(--text-2);margin:5px 0 0}
.rule{height:1px;background:linear-gradient(90deg,var(--gold-line),transparent 40%);margin:14px 0 18px}

.grid{display:grid;gap:12px}
.k8{grid-template-columns:repeat(8,minmax(0,1fr))}
.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.split{display:grid;gap:14px;grid-template-columns:minmax(0,1fr) 348px}
.stack>*+*{margin-top:14px}

/* ---------- kpi ---------- */
.kpi{
  position:relative;overflow:hidden;text-align:left;width:100%;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 13px 12px;
  transition:transform .16s,border-color .16s,box-shadow .16s;
}
.kpi:hover{transform:translateY(-2px);border-color:var(--line-2);box-shadow:var(--shadow)}
.kpi.on{border-color:var(--gold-line);box-shadow:0 0 0 1px var(--gold-veil)}
.kpi::after{content:"";position:absolute;left:0;right:0;bottom:0;height:1.5px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:0;transition:opacity .16s}
.kpi:hover::after{opacity:.75}
.kpi-t{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.kpi-l{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3);font-weight:600}
.kpi-v{font-family:var(--display);font-size:25px;font-weight:600;letter-spacing:-.035em;line-height:1;margin-top:10px;font-variant-numeric:tabular-nums}
.kpi-h{font-size:11px;color:var(--text-3);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-d{font-family:var(--mono);font-size:10.5px;margin-left:7px;font-weight:500}
.t-gold{color:var(--gold)} .t-rose{color:var(--rose)} .t-amber{color:var(--amber)}
.t-blue{color:var(--blue)} .t-teal{color:var(--teal)} .t-peri{color:var(--peri)}
.t-orange{color:var(--orange)} .t-mauve{color:var(--mauve)} .t-green{color:var(--green)}
.t-dim{color:var(--text-2)}

/* ---------- panel ---------- */
.pan{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pan-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 15px;border-bottom:1px solid var(--line)}
.pan-t{font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:-.01em;margin:0}
.pan-s{font-size:11px;color:var(--text-3);margin:3px 0 0}
.pan-b{padding:15px}
.pan-b.flush{padding:0}

/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;padding:2.5px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;border:1px solid}
.badge i{width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.b-amber{color:var(--amber);background:var(--amber-veil);border-color:var(--amber-line)}
.b-blue{color:var(--blue);background:var(--blue-veil);border-color:var(--blue-line)}
.b-peri{color:var(--peri);background:var(--peri-veil);border-color:var(--peri-line)}
.b-teal{color:var(--teal);background:var(--teal-veil);border-color:var(--teal-line)}
.b-sky{color:var(--sky);background:var(--sky-veil);border-color:var(--sky-line)}
.b-orange{color:var(--orange);background:var(--orange-veil);border-color:var(--orange-line)}
.b-mauve{color:var(--mauve);background:var(--mauve-veil);border-color:var(--mauve-line)}
.b-rose{color:var(--rose);background:var(--rose-veil);border-color:var(--rose-line)}
.b-green{color:var(--green);background:var(--green-veil);border-color:var(--green-line)}
.b-mute{color:var(--text-2);background:rgba(255,255,255,.05);border-color:var(--line)}
html[data-theme="ivory"] .b-mute{background:rgba(22,26,37,.05)}

/* ---------- alerts ---------- */
.alert{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:11px 14px;border-radius:var(--r-sm);border:1px solid;transition:transform .15s}
.alert:hover{transform:translateX(2px)}
.a-red{border-color:var(--rose-line);background:var(--rose-veil)}
.a-amb{border-color:var(--amber-line);background:var(--amber-veil)}
.alert .bl{width:7px;height:7px;border-radius:50%;flex:none}
.a-red .bl{background:var(--rose);box-shadow:0 0 0 4px rgba(240,97,109,.16)}
.a-amb .bl{background:var(--amber);box-shadow:0 0 0 4px rgba(233,169,58,.16)}
.alert p{margin:0;flex:1;font-size:12.5px}
.a-red p{color:var(--rose)} .a-amb p{color:var(--amber)}
@media(prefers-reduced-motion:no-preference){
  .alert .bl{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
}

/* ---------- THE RAIL (signature) ---------- */
.rail{position:relative;padding:22px 0 4px}
.rail-line{position:absolute;left:0;right:0;top:12px;height:1px;background:linear-gradient(90deg,var(--rose-line) 0%,var(--gold-line) 22%,var(--gold-line) 60%,transparent 100%)}
.rail-track{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;position:relative}
.rail-track::-webkit-scrollbar{display:none}
.day{
  position:relative;flex:1 0 96px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:rgba(255,255,255,.015);padding:14px 11px 11px;text-align:left;transition:all .16s;
}
html[data-theme="ivory"] .day{background:rgba(22,26,37,.015)}
.day:hover{border-color:var(--line-2);transform:translateY(-2px)}
.day .mk{position:absolute;top:-16px;left:50%;transform:translateX(-50%) rotate(45deg);width:7px;height:7px;background:var(--panel);border:1px solid var(--gold-line)}
.day.past{border-color:var(--rose-line);background:var(--rose-veil)}
.day.past .mk{border-color:var(--rose);background:var(--rose)}
.day.now{border-color:var(--gold-line);background:var(--gold-veil)}
.day.now .mk{background:linear-gradient(145deg,var(--gold-hi),var(--gold-lo));border-color:var(--gold-hi);box-shadow:0 0 10px var(--gold-line)}
.day-l{font-size:10.5px;font-weight:600;color:var(--text-3);letter-spacing:.03em}
.day.past .day-l{color:var(--rose)} .day.now .day-l{color:var(--gold)}
.day-n{font-family:var(--display);font-size:21px;font-weight:600;letter-spacing:-.03em;margin-top:4px;font-variant-numeric:tabular-nums}
.day-u{font-size:9.5px;color:var(--text-3);margin-top:1px}
.day-bar{height:3px;border-radius:3px;background:rgba(255,255,255,.07);margin-top:9px;overflow:hidden}
html[data-theme="ivory"] .day-bar{background:rgba(22,26,37,.08)}
.day-bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--gold-lo),var(--gold-hi));transition:width .4s ease}
.day.past .day-bar i{background:var(--rose)}

.dl-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}
.dl{padding:13px 14px;border-radius:var(--r-sm);border:1px solid}

.dl-last{border-color:var(--line);background:rgba(255,255,255,.02)}

.dl-v{font-family:var(--display);font-size:17.5px;font-weight:600;letter-spacing:-.025em;margin-top:5px}

/* ---------- tables ---------- */
.tbl-scroll{max-height:568px;overflow:auto}

thead th{
  position:sticky;top:0;z-index:5;background:var(--panel-2);
  padding:9px 12px;text-align:left;white-space:nowrap;
  font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);font-weight:700;
  border-bottom:1px solid var(--line);
}
thead th.sortable{cursor:pointer;user-select:none;transition:color .14s}
thead th.sortable:hover{color:var(--gold)}
thead th.r{text-align:right}
tbody tr{border-bottom:1px solid var(--line);transition:background .13s}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--gold-veil)}
tbody td{padding:10px 12px;white-space:nowrap}
td.wrap-c{max-width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-2)}
td.r{text-align:right}
.chev{color:var(--text-3);opacity:.5;transition:opacity .13s,transform .13s}
tr:hover .chev{opacity:1;transform:translateX(2px);color:var(--gold)}
.pager{display:flex;align-items:center;justify-content:space-between;padding:10px 15px;border-top:1px solid var(--line)}
.pg{padding:4px 10px;border-radius:var(--r-xs);font-size:11.5px;color:var(--text-2);transition:background .13s}
.pg:hover:not(:disabled){background:rgba(255,255,255,.06);color:var(--text)}
html[data-theme="ivory"] .pg:hover:not(:disabled){background:rgba(22,26,37,.06)}
.pg:disabled{opacity:.3;cursor:default}
.acc-mark{width:27px;height:27px;flex:none;border-radius:7px;display:grid;place-items:center;font-size:10.5px;font-weight:700;background:rgba(255,255,255,.05);color:var(--text-2);border:1px solid var(--line)}
html[data-theme="ivory"] .acc-mark{background:rgba(22,26,37,.05)}
.acc-mark.hot{background:var(--rose-veil);color:var(--rose);border-color:var(--rose-line)}
.btn-view{padding:4px 10px;border:1px solid var(--line);border-radius:var(--r-xs);font-size:11px;font-weight:600;color:var(--text-2);display:inline-flex;align-items:center;gap:4px;transition:all .14s}
.btn-view:hover{border-color:var(--gold-line);background:var(--gold-veil);color:var(--gold)}
.empty{display:flex;flex-direction:column;align-items:center;gap:9px;padding:56px 20px;text-align:center}
.empty .ring{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--teal-veil);color:var(--teal)}

/* ---------- comparison ---------- */
.cmp-row{display:flex;align-items:center;gap:12px}
.cmp-row+.cmp-row{margin-top:9px}
.cmp-n{width:132px;flex:none;font-size:12.5px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmp-t{position:relative;flex:1;height:25px;border-radius:var(--r-xs);background:rgba(255,255,255,.045);overflow:hidden}
html[data-theme="ivory"] .cmp-t{background:rgba(22,26,37,.05)}
.cmp-t i{display:block;height:100%;border-radius:var(--r-xs);background:linear-gradient(90deg,var(--gold-lo),var(--gold));transition:width .45s ease}
.cmp-row.worst .cmp-t i{background:linear-gradient(90deg,color-mix(in srgb,var(--rose) 70%,#000),var(--rose))}
.cmp-t span{position:absolute;left:10px;top:0;height:100%;display:flex;align-items:center;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--text)}
.cmp-e{width:62px;flex:none;text-align:right;font-family:var(--mono);font-size:10.5px;color:var(--text-3)}

/* ---------- charts ---------- */
.legend{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;margin-top:10px}
.lg{display:flex;align-items:center;gap:7px;padding:3px 5px;border-radius:5px;text-align:left;width:100%;transition:background .13s}
.lg:hover{background:rgba(255,255,255,.05)}
html[data-theme="ivory"] .lg:hover{background:rgba(22,26,37,.05)}
.lg i{width:8px;height:8px;border-radius:2.5px;flex:none}

.axis{font-family:var(--mono);font-size:9.5px;fill:var(--text-3)}
.gl{stroke:var(--grid);stroke-width:1}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(4,6,11,.62);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;z-index:61;width:min(440px,100%);
  background:var(--panel);border-left:1px solid var(--line-2);box-shadow:-24px 0 60px -20px rgba(0,0,0,.8);
  display:flex;flex-direction:column;transform:translateX(102%);transition:transform .26s cubic-bezier(.32,.72,0,1);
}

@media(prefers-reduced-motion:reduce){.drawer{transition:none}}
.dr-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:15px 17px;border-bottom:1px solid var(--line)}
.dr-b{flex:1;overflow-y:auto;padding:13px 17px}

.act:hover{border-color:var(--gold-line);background:var(--gold-veil);color:var(--gold)}
.dr-item{padding:11px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:rgba(255,255,255,.02);margin-bottom:12px}
html[data-theme="ivory"] .dr-item{background:rgba(22,26,37,.02)}

.dr-v{font-size:12.5px;text-align:right;color:var(--text-2)}
.note{padding:11px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:rgba(255,255,255,.02);font-size:12.5px;color:var(--text-2);line-height:1.6}
html[data-theme="ivory"] .note{background:rgba(22,26,37,.02)}

/* ---------- misc ---------- */
.toast{position:fixed;left:50%;bottom:22px;z-index:80;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:9px;padding:10px 16px;border-radius:var(--r-sm);
  background:var(--panel-2);border:1px solid var(--gold-line);box-shadow:var(--shadow);font-size:12.5px;transition:all .22s}
.toast.on{transform:translate(-50%,0);opacity:1}
.bell-pop{position:absolute;right:0;top:calc(100% + 8px);width:320px;background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;display:none;z-index:50}
.bell-pop.on{display:block}
.bell-pop h4{margin:0;padding:11px 14px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);border-bottom:1px solid var(--line)}
.bell-i{display:flex;gap:10px;padding:10px 14px;width:100%;text-align:left;border-bottom:1px solid var(--line);transition:background .13s}
.bell-i:last-child{border-bottom:none}
.bell-i:hover{background:var(--gold-veil)}
.bell-i i{width:6px;height:6px;border-radius:50%;flex:none;margin-top:6px}
.bell-i p{margin:0;font-size:12px;color:var(--text-2);line-height:1.45}
.back{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3);margin-bottom:14px;transition:color .14s}
.back:hover{color:var(--gold)}
code{font-family:var(--mono);font-size:11.5px;background:var(--gold-veil);color:var(--gold);padding:1.5px 5px;border-radius:4px}
.foot{margin-top:30px;padding-top:15px;border-top:1px solid var(--line);font-size:11px;color:var(--text-3)}

/* ---------- responsive ---------- */
@media(max-width:1280px){ .k8{grid-template-columns:repeat(4,minmax(0,1fr))} .split{grid-template-columns:1fr} }
@media(max-width:1024px){
  .shell{flex-direction:column}
  .side{position:static;height:auto;width:100%;flex:none;flex-direction:row;align-items:center;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line)}
  .brand{border-bottom:none;border-right:1px solid var(--line);flex:none}

}

@media(max-width:560px){ .wrap{padding:14px} .top-r{padding:10px 14px} .quick{padding:0 14px 9px} .cmp-n{width:88px} }
</style>

<script>
/* ==========================================================
   1. DATA LAYER — swap loadOrders() for your API call.
   ========================================================== */

const ACCOUNTS=[
 {id:"growmore786",name:"Azhar Bhai",handle:"growmore786",owner:"Wahab"},
 {id:"saifbhai",name:"Saif Bhai",handle:"saif_bhai_uk",owner:"Rana Noman"},
 {id:"troviaco",name:"Amna Saif",handle:"TroviaCo",owner:"Zeeshan"},
 {id:"hafizabaji",name:"Hafiza Baji",handle:"hafiza_store",owner:"Wahab"},
 {id:"sirhasib",name:"Sir Hasib",handle:"hasib_retail",owner:"Rana Noman"},
 {id:"abrt",name:"ABRT",handle:"abrt_uk",owner:"Zeeshan"},
 {id:"yasin",name:"Yasin",handle:"yasin_trading",owner:"Wahab"}
];

const STATUSES=["Awaiting Dispatch","Dispatched","Tracking Pending","Tracking Uploaded","Replacement","Wrong Order","Recheck Required","Overdue","Completed"];
const SB={"Awaiting Dispatch":"b-amber","Dispatched":"b-blue","Tracking Pending":"b-peri","Tracking Uploaded":"b-teal","Replacement":"b-sky","Wrong Order":"b-orange","Recheck Required":"b-mauve","Overdue":"b-rose","Completed":"b-green"};
const SC={"Awaiting Dispatch":"--amber","Dispatched":"--blue","Tracking Pending":"--peri","Tracking Uploaded":"--teal","Replacement":"--sky","Wrong Order":"--orange","Recheck Required":"--mauve","Overdue":"--rose","Completed":"--green"};

const TODAY=new Date(2026,7,10);

const BUYERS=["J. Whitfield","A. Kowalski","M. O'Connell","S. Bhattacharya","L. Nguyen","R. Ferreira","D. MacLeod","P. Osei","H. Lindqvist","C. Ivanova","T. Yamamoto","G. Rossi","N. Abadi","E. Doyle","K. Fischer","B. Sorensen","V. Petrov","W. Achebe","F. Marchetti","Z. Rahman"];
const ITEMS=["12V LED Work Light Bar","Car Roof Rack Cross Bars","Stainless Steel Sink Strainer","Blackout Thermal Curtains 66x72","Cordless Tyre Inflator 150PSI","Silicone Baking Mat Set","Bike Phone Mount Handlebar","Garden Hose Reel 30m","OBD2 Diagnostic Scanner","Memory Foam Seat Cushion","Waterproof Dog Coat Large","Wheel Trim Set 15 Inch","Kitchen Drawer Organiser","USB-C Fast Charger 65W","Solar Garden Path Lights x8","Adjustable Laptop Stand","Ratchet Tie Down Straps 4pk","Shower Head High Pressure","Boot Liner Mat Universal","Reusable Vacuum Bags x6"];
const RECHECK=["Buyer changed address after payment","Variant mismatch flagged by lister","Supplier sent different model","Price anomaly vs Brain v17 gate","Duplicate order suspected","Combined shipping request","Address failed validation","High-value order — manual check"];
const WRONG=["Wrong colour dispatched","Wrong size variant","Wrong model shipped by supplier","Quantity short by 1","Wrong item entirely","Missing accessory in pack"];
const STAFF=["Wahab","Rana Noman","Zeeshan","Husnain Naeem","Yousaf Zahoor"];
const COURIERS=["Royal Mail 48","Evri Standard","Yodel Xpress","DPD Local","Royal Mail Tracked 24"];
const NOTES=["Buyer asked for dispatch before Friday.","Supplier confirmed restock 12 Aug.","Combine with buyer's other order.","Address flagged — building name missing.","Second attempt after failed delivery."];

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const fShort=d=>d.toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const fFull=d=>d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
const fDT=d=>fShort(d)+", "+d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
const dk=d=>d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate();
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const unISO=s=>{const p=s.split("-").map(Number);return new Date(p[0],p[1]-1,p[2])};
const acc=id=>ACCOUNTS.find(a=>a.id===id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function loadOrders(){
  const r=mulberry(98981),out=[];
  const vol={growmore786:640,saifbhai:412,troviaco:358,hafizabaji:296,sirhasib:268,abrt:244,yasin:240};
  let seq=40219;
  ACCOUNTS.forEach(a=>{
    const n=vol[a.id];
    const risk=a.id==="yasin"?1.9:a.id==="troviaco"?.35:a.id==="abrt"?1.25:1;
    for(let i=0;i<n;i++){
      seq+=1+Math.floor(r()*3);
      const ago=Math.floor(Math.pow(r(),1.5)*26);
      const od=addDays(TODAY,-ago); od.setHours(7+Math.floor(r()*14),Math.floor(r()*60),0,0);
      const dl=addDays(od,1+Math.floor(r()*4)); dl.setHours(16,0,0,0);
      const x=r()*100; let st;
      if(ago>9){ st = x<88?"Completed":x<94?"Dispatched":x<97?"Replacement":"Wrong Order"; }
      else if(ago>4){
        st = x<52?"Completed":x<74?"Tracking Uploaded":x<82?"Dispatched":
             x<87+risk*2?"Tracking Pending":x<91+risk*2?"Replacement":
             x<94+risk?"Wrong Order":x<97?"Recheck Required":"Overdue";
      } else {
        st = x<26?"Awaiting Dispatch":x<44?"Tracking Pending":x<60?"Dispatched":
             x<72?"Tracking Uploaded":x<80?"Completed":x<84+risk?"Recheck Required":
             x<88+risk?"Replacement":x<92+risk?"Wrong Order":"Awaiting Dispatch";
      }
      if((st==="Awaiting Dispatch"||st==="Tracking Pending")&&dl<TODAY&&r()<.55*risk) st="Overdue";
      const tracked=st==="Tracking Uploaded"||st==="Dispatched"||st==="Completed";
      out.push({
        id:(21-Math.floor(seq/1000))+"-"+String(11000+seq%9000).slice(0,5)+"-"+String(70000+Math.floor(r()*29999)),
        accountId:a.id, buyer:BUYERS[Math.floor(r()*BUYERS.length)], item:ITEMS[Math.floor(r()*ITEMS.length)],
        qty:r()<.86?1:2, value:Math.round((7+r()*63)*100)/100, orderDate:od, deadline:dl, status:st,
        tracking:tracked?["RM","EV","YD","DP"][Math.floor(r()*4)]+Math.floor(r()*899999999+1e8)+"GB":null,
        courier:tracked?COURIERS[Math.floor(r()*COURIERS.length)]:null,
        assignee:STAFF[Math.floor(r()*STAFF.length)],
        recheckReason:st==="Recheck Required"?RECHECK[Math.floor(r()*RECHECK.length)]:null,
        wrongIssue:st==="Wrong Order"?WRONG[Math.floor(r()*WRONG.length)]:null,
        replacementStage:st==="Replacement"?["Pending","Dispatched","Completed"][Math.floor(r()*3)]:null,
        originalOrder:st==="Replacement"?"20-"+String(10000+Math.floor(r()*8999))+"-"+String(60000+Math.floor(r()*39999)):null,
        notes:r()<.22?NOTES[Math.floor(r()*NOTES.length)]:"",
        updated:addDays(TODAY,-Math.floor(r()*3))
      });
    }
  });
  return out;
}

let ORDERS=loadOrders();

/* ==========================================================
   2. DERIVED METRICS
   ========================================================== */
const OPEN=["Awaiting Dispatch","Tracking Pending","Overdue","Recheck Required"];

function stats(list){
  const s={total:list.length,trackingPending:0,replacement:0,wrong:0,recheck:0,overdue:0,awaiting:0,dispatched:0,completed:0,value:0};
  let latest=null,next=null;
  list.forEach(o=>{
    s.value+=o.value;
    if(o.status==="Tracking Pending")s.trackingPending++;
    if(o.status==="Replacement")s.replacement++;
    if(o.status==="Wrong Order")s.wrong++;
    if(o.status==="Recheck Required")s.recheck++;
    if(o.status==="Overdue")s.overdue++;
    if(o.status==="Awaiting Dispatch")s.awaiting++;
    if(o.status==="Dispatched"||o.status==="Tracking Uploaded")s.dispatched++;
    if(o.status==="Completed")s.completed++;
    if(o.status==="Awaiting Dispatch"||o.status==="Tracking Pending"){
      if(!latest||o.deadline>latest)latest=o.deadline;
      if(o.deadline>=TODAY&&(!next||o.deadline<next))next=o.deadline;
    }
  });
  s.latest=latest; s.next=next;
  const open=o=>o.status==="Awaiting Dispatch"||o.status==="Tracking Pending";
  s.latestN=latest?list.filter(o=>open(o)&&dk(o.deadline)===dk(latest)).length:0;
  s.nextN=next?list.filter(o=>open(o)&&dk(o.deadline)===dk(next)).length:0;
  s.openWork=s.trackingPending+s.overdue+s.awaiting+s.recheck;
  return s;
}

function urg(d){
  const h=(d-TODAY)/36e5;
  if(h<0)return{k:"Overdue",c:"b-rose"};
  if(h<24)return{k:"Urgent",c:"b-orange"};
  if(h<48)return{k:"Due Soon",c:"b-amber"};
  return{k:"Normal",c:"b-mute"};
}
function left(d){
  const ms=d-TODAY,a=Math.abs(ms),dd=Math.floor(a/864e5),hh=Math.floor(a%864e5/36e5);
  const t=dd>0?dd+"d "+hh+"h":hh+"h";
  return ms<0?t+" late":t;
}

   3. STATE
   ========================================================== */
const S={view:"dashboard",account:null,order:null,page:1,
  f:{q:"",acc:"all",st:"all",win:"all",urg:"all",from:null,to:null,field:"ordered"},
  sort:{key:"deadline",dir:"asc"}, cmp:"overduePct"};

function filtered(){
  const f=S.f,q=f.q.toLowerCase();
  return ORDERS.filter(o=>{
    if(f.acc!=="all"&&o.accountId!==f.acc)return false;
    if(f.st!=="all"&&o.status!==f.st)return false;
    if(q){const a=acc(o.accountId);
      if(!o.id.toLowerCase().includes(q)&&!o.buyer.toLowerCase().includes(q)&&!o.item.toLowerCase().includes(q)&&!a.name.toLowerCase().includes(q))return false;}
    if(f.win==="custom"){
      const d=f.field==="deadline"?o.deadline:o.orderDate;
      if(f.from&&d<f.from)return false;
      if(f.to&&d>f.to)return false;
    } else if(f.win!=="all"&&(TODAY-o.orderDate)/864e5>+f.win)return false;
    if(f.urg!=="all"&&urg(o.deadline).k!==f.urg)return false;
    return true;
  });
}

function rangeLabel(){
  const f=S.f;
  if(f.win!=="custom")return "";
  const a=f.from?fShort(f.from):"Any", b=f.to?fShort(f.to):"Any";
  return (f.field==="deadline"?"Deadline":"Ordered")+" "+a+" → "+b;
}

function alerts(){
  const g=stats(ORDERS),a=[];
  if(g.overdue)a.push({t:"red",m:g.overdue+" orders are past their dispatch deadline",go:"Overdue"});
  if(g.trackingPending)a.push({t:"amb",m:g.trackingPending+" orders are waiting on tracking upload",go:"Tracking Pending"});
  const today=ORDERS.filter(o=>(o.status==="Awaiting Dispatch"||o.status==="Tracking Pending")&&dk(o.deadline)===dk(TODAY)).length;
  if(today)a.push({t:"amb",m:today+" orders have a dispatch deadline today",go:"Awaiting Dispatch"});
  if(g.wrong)a.push({t:"red",m:g.wrong+" wrong orders need a resolution decision",go:"Wrong Order"});
  if(g.recheck)a.push({t:"amb",m:g.recheck+" orders are flagged for manual recheck",go:"Recheck Required"});
  return a;
}

function donut(data,size){
  const R=size/2,r=R-14,C=2*Math.PI*r,total=data.reduce((a,d)=>a+d.v,0)||1;
  let off=0,arcs="";
  data.forEach(d=>{
    const len=d.v/total*C;
    arcs+='<circle cx="'+R+'" cy="'+R+'" r="'+r+'" fill="none" stroke="var('+d.c+')" stroke-width="18" '
        +'stroke-dasharray="'+(len-2.5)+' '+(C-len+2.5)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 '+R+' '+R+')"><title>'+esc(d.n)+': '+d.v+'</title></circle>';
    off+=len;
  });
  return '<svg viewBox="0 0 '+size+' '+size+'" width="100%" height="'+size+'" style="display:block;margin:0 auto">'+arcs
    +'<text x="'+R+'" y="'+(R-3)+'" text-anchor="middle" fill="var(--text)" style="font-family:Sora;font-size:22px;font-weight:600">'+total.toLocaleString()+'</text>'
    +'<text x="'+R+'" y="'+(R+14)+'" text-anchor="middle" fill="var(--text-3)" style="font-size:10px;letter-spacing:.09em">ORDERS</text></svg>';
}

function bars(data,h){

  data.forEach((d,i)=>{

    b+='<rect x="'+(cx-bw-2)+'" y="'+(pt+ih-ha)+'" width="'+bw+'" height="'+ha+'" rx="3" fill="url(#gGold)"><title>'+esc(d.n)+' — total '+d.a+'</title></rect>'

function table(list,cols,emptyMsg){
  if(!list.length) return '<div class="empty"><div class="ring">'+ico("check",18)+'</div>'
    +'<p style="margin:0;font-weight:600">'+(emptyMsg||"Nothing here right now")+'</p>'
    +'<p style="margin:0;font-size:12px;color:var(--text-3)">Adjust the filters to widen the search.</p></div>';

  const k=S.sort.key,dir=S.sort.dir==="asc"?1:-1;
  const arr=[...list].sort((a,b)=>{
    switch(k){
      case "deadline":return (a.deadline-b.deadline)*dir;
      case "ordered":return (a.orderDate-b.orderDate)*dir;
      case "account":return a.accountId.localeCompare(b.accountId)*dir;
      case "status":return a.status.localeCompare(b.status)*dir;
      default:return a.id.localeCompare(b.id)*dir;
    }
  });
  const pages=Math.max(1,Math.ceil(arr.length/PER));

    +'<button class="pg" data-pg="next"'+(S.page===pages?" disabled":"")+'>Next</button></div></div>';
}

    const s=stats(list.filter(o=>o.accountId===a.id)),p=n=>s.total?+(n/s.total*100).toFixed(2):0;
    return{name:a.name,handle:a.handle,total:s.total,trackingPct:p(s.trackingPending),overduePct:p(s.overdue),
      replacementPct:p(s.replacement),wrongPct:p(s.wrong),recheckPct:p(s.recheck),
      dispatchPct:+((s.dispatched+s.completed)/(s.total||1)*100).toFixed(1)};
  });
  const M=[{v:"overduePct",l:"Overdue %",bad:1},{v:"trackingPct",l:"Tracking pending %",bad:1},
    {v:"replacementPct",l:"Replacement %",bad:1},{v:"wrongPct",l:"Wrong order %",bad:1},
    {v:"recheckPct",l:"Recheck %",bad:1},{v:"dispatchPct",l:"Dispatch completion %",bad:0}];
  const m=M.find(x=>x.v===S.cmp);
  const sorted=[...rows].sort((a,b)=>m.bad?b[S.cmp]-a[S.cmp]:a[S.cmp]-b[S.cmp]);
  const max=Math.max(...sorted.map(r=>r[S.cmp]),1);
  let bar="";
  sorted.forEach((r,i)=>{
    bar+='<div class="cmp-row'+(i===0&&m.bad?" worst":"")+'"><div class="cmp-n">'+r.name+'</div>'
      +'<div class="cmp-t"><i style="width:'+(r[S.cmp]/max*100)+'%"></i><span>'+r[S.cmp]+'%</span></div>'
      +'<div class="cmp-e">'+r.total+' ord</div></div>';
  });
  const sel='<label class="sel"><select id="cmpSel">'
    +M.map(x=>'<option value="'+x.v+'"'+(x.v===S.cmp?" selected":"")+'>'+x.l+'</option>').join("")
    +'</select><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg></label>';

  const heads=["Account","Total orders","Tracking pending %","Overdue %","Replacement %","Wrong order %","Recheck %","Dispatch completion %"];
  let mtb="";
  rows.forEach(r=>{
    mtb+='<tr><td>'+r.name+' <span style="color:var(--text-3);font-size:11px">'+r.handle+'</span></td>'
      +'<td class="r num">'+r.total+'</td><td class="r num t-dim">'+r.trackingPct+'%</td>'
      +'<td class="r num '+(r.overduePct>2?"t-rose":"t-dim")+'">'+r.overduePct+'%</td>'
      +'<td class="r num t-dim">'+r.replacementPct+'%</td><td class="r num t-dim">'+r.wrongPct+'%</td>'
      +'<td class="r num t-dim">'+r.recheckPct+'%</td>'
      +'<td class="r num '+(r.dispatchPct>80?"t-green":"t-amber")+'">'+r.dispatchPct+'%</td></tr>';
  });
  return pan("Account performance comparison","Ranked worst-first on the selected metric",bar,sel)
    +'<div style="height:14px"></div>'
    +pan("Full comparison matrix","",'<div style="overflow-x:auto"><table><thead><tr>'
      +heads.map((h,i)=>'<th'+(i?' class="r"':"")+'>'+h+'</th>').join("")
      +'</tr></thead><tbody>'+mtb+'</tbody></table></div>',"",true);
}

  S.f.urg="all"; S.page=1; S.account=null;
  S.view = st==="Tracking Pending"?"tracking": st==="Overdue"?"overdue":
           st==="Awaiting Dispatch"?"awaiting": st==="Replacement"?"replacements":
           st==="Wrong Order"?"wrong": st==="Recheck Required"?"recheck":"orders";
  document.getElementById("fSt").value=S.f.st;
  document.getElementById("bellPop").classList.remove("on");
  render();
}

/* --- one-time setup --- */
document.getElementById("stamp").textContent=fFull(TODAY);
const opt=(v,l,sel)=>'<option value="'+v+'"'+(sel?" selected":"")+'>'+l+'</option>';
document.getElementById("fAcc").innerHTML=opt("all","All accounts")+ACCOUNTS.map(a=>opt(a.id,a.name)).join("");
document.getElementById("fSt").innerHTML=opt("all","All statuses")+STATUSES.map(s=>opt(s,s)).join("");
document.getElementById("fWin").innerHTML=[["all","All time"],["7","Last 7 days"],["14","Last 14 days"],["30","Last 30 days"],["custom","Custom range…"]].map(x=>opt(x[0],x[1])).join("");

document.getElementById("fAcc").onchange=e=>{S.f.acc=e.target.value;S.page=1;render()};
document.getElementById("fSt").onchange=e=>{S.f.st=e.target.value;S.page=1;render()};

/* --- custom date range --- */
const $=id=>document.getElementById(id);
let winPrev="all", draftField="ordered";
$("rpFrom").min=$("rpTo").min=iso(addDays(TODAY,-45));
$("rpFrom").max=$("rpTo").max=iso(addDays(TODAY,14));

function paintField(){
  document.querySelectorAll("#rpField button").forEach(b=>b.classList.toggle("on",b.dataset.field===draftField));
}
function openRange(){
  draftField=S.f.field;
  $("rpFrom").value=S.f.from?iso(S.f.from):"";
  $("rpTo").value=S.f.to?iso(S.f.to):"";
  paintField();
  $("rpErr").classList.remove("on");
  $("rangePop").classList.add("on");
  $("bellPop").classList.remove("on");
  setTimeout(()=>$("rpFrom").focus(),30);
}
function closeRange(){$("rangePop").classList.remove("on");$("rpErr").classList.remove("on")}
function cancelRange(){closeRange();$("fWin").value=S.f.win==="custom"?"custom":winPrev}
function clearRange(){
  S.f.win="all";S.f.from=null;S.f.to=null;winPrev="all";
  $("fWin").value="all";S.page=1;closeRange();render();
}

$("fWin").onchange=e=>{
  const v=e.target.value;
  if(v==="custom"){openRange();return}
  winPrev=v;S.f.win=v;S.f.from=null;S.f.to=null;S.page=1;closeRange();render();
};

$("rpField").onclick=e=>{const b=e.target.closest("[data-field]");if(!b)return;draftField=b.dataset.field;paintField()};

$("rpSets").onclick=e=>{
  const b=e.target.closest("[data-preset]");if(!b)return;
  const p=b.dataset.preset;let from,to;
  if(p==="today"){from=new Date(TODAY);to=new Date(TODAY)}
  else if(p==="week"){const dow=(TODAY.getDay()+6)%7;from=addDays(TODAY,-dow);to=addDays(from,6)}
  else if(p==="month"){from=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);to=new Date(TODAY.getFullYear(),TODAY.getMonth()+1,0)}
  else{from=new Date(TODAY);to=addDays(TODAY,7);draftField="deadline";paintField()}
  $("rpFrom").value=iso(from);$("rpTo").value=iso(to);$("rpErr").classList.remove("on");
};

$("rpApply").onclick=()=>{
  const fv=$("rpFrom").value,tv=$("rpTo").value;
  if(!fv&&!tv){clearRange();return}
  const from=fv?unISO(fv):null;let to=tv?unISO(tv):null;
  if(from&&to&&to<from){$("rpErr").classList.add("on");return}
  if(to)to.setHours(23,59,59,999);
  S.f.win="custom";S.f.from=from;S.f.to=to;S.f.field=draftField;S.page=1;
  $("fWin").value="custom";closeRange();render();
  toast(rangeLabel()+" · "+filtered().length.toLocaleString()+" orders");
};
$("rpCancel").onclick=cancelRange;
["rpFrom","rpTo"].forEach(id=>{
  $(id).oninput=()=>$("rpErr").classList.remove("on");
  $(id).onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();$("rpApply").click()}};
});
$("rangeWrap").onclick=e=>{e.stopPropagation();$("bellPop").classList.remove("on")};

let qT;
document.getElementById("q").addEventListener("input",e=>{
  S.f.q=e.target.value;S.page=1;clearTimeout(qT);qT=setTimeout(render,140);
});
document.getElementById("qclr").onclick=()=>{S.f.q="";document.getElementById("q").value="";S.page=1;render()};
document.getElementById("clearAll").onclick=()=>{
  S.f={q:"",acc:"all",st:"all",win:"all",urg:"all",from:null,to:null,field:"ordered"};
  S.page=1;winPrev="all";draftField="ordered";
  document.getElementById("q").value="";
  document.getElementById("fAcc").value="all";
  document.getElementById("fSt").value="all";
  document.getElementById("fWin").value="all";
  closeRange();render();
};
document.getElementById("bell").onclick=e=>{e.stopPropagation();document.getElementById("bellPop").classList.toggle("on");closeRange()};
document.addEventListener("click",()=>{document.getElementById("bellPop").classList.remove("on");cancelRange()});
document.getElementById("bellPop").onclick=e=>e.stopPropagation();

document.getElementById("theme").onclick=()=>{
  const el=document.documentElement;
  el.dataset.theme = el.dataset.theme==="royal" ? "ivory" : "royal";
  toast(el.dataset.theme==="royal" ? "Royal navy" : "Ivory daylight");
};

document.getElementById("scrim").onclick=closeDrawer;
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeDrawer();document.getElementById("bellPop").classList.remove("on");cancelRange()}});

/* --- delegated clicks --- */
document.body.addEventListener("click",e=>{
  if(e.target.closest("#rpClear")){e.stopPropagation();clearRange();return}
  if(e.target.closest("#rpEdit")){e.stopPropagation();document.getElementById("fWin").value="custom";openRange();return}

  const a=e.target.closest("[data-act]");
  if(a){
    const [k,v]=a.dataset.act.split(/:(.+)/);
    if(k==="view"){S.view=v;S.account=null;S.page=1;render()}
    else if(k==="go"){goStatus(v)}
    else if(k==="acct"){S.account=v;S.page=1;render()}
    return;
  }
  const s=e.target.closest("[data-sort]");
  if(s){const k=s.dataset.sort;S.sort=(S.sort.key===k&&S.sort.dir==="asc")?{key:k,dir:"desc"}:{key:k,dir:"asc"};render();return}

  const p=e.target.closest("[data-pg]");
  if(p&&!p.disabled){S.page+= p.dataset.pg==="next"?1:-1; if(S.page<1)S.page=1; render(); return}

  const r=e.target.closest("[data-open]");
  if(r){openDrawer(r.dataset.open);return}

  const d=e.target.closest("[data-do]");
  if(d&&S.order){
    const o=ORDERS.find(x=>x.id===S.order),st=d.dataset.do;
    o.status=st; o.updated=TODAY;
    if(st==="Tracking Uploaded"&&!o.tracking) o.tracking="RM"+Math.floor(Math.random()*899999999+1e8)+"GB";
    if(st!=="Replacement") o.replacementStage=null;
    toast(o.id+" → "+st);
    openDrawer(o.id); render(); return;
  }
  if(e.target.closest("#drClose")) closeDrawer();
});

document.body.addEventListener("change",e=>{
  if(e.target.id==="urgSel"){S.f.urg=e.target.value;S.page=1;render()}
  if(e.target.id==="cmpSel"){S.cmp=e.target.value;render()}
});

render();
</script>
</body>
</html>
